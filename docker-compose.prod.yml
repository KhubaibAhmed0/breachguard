version: '3.8'

# Production Target Topology:
# Internet -> Nginx Reverse Proxy (SSL/WAF/Rate-limiting) -> Next.js / FastAPI -> Private Network (Postgres, Redis)
# Database and Redis have ZERO host port bindings; reachable exclusively through internal network.

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: breachguard-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - public_network
      - dmz_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: breachguard-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.breachguard.io
    networks:
      - dmz_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: breachguard-backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - dmz_network
      - internal_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16-alpine
    container_name: breachguard-db
    restart: always
    # Security: ZERO exposed host ports. Accessible strictly on internal_network.
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_network
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: breachguard-redis
    restart: always
    # Security: ZERO exposed host ports. Accessible strictly on internal_network.
    expose:
      - "6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-strongredispass}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal_network
    security_opt:
      - no-new-privileges:true

networks:
  public_network:
    driver: bridge
  dmz_network:
    driver: bridge
    internal: false
  internal_network:
    driver: bridge
    # Strict network isolation: containers cannot access or be accessed outside docker network
    internal: true

volumes:
  postgres_data:
  redis_data:
