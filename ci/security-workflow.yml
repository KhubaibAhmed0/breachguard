name: BreachGuard Security CI & Vulnerability Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Security Audits & Supply Chain Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Frontend Dependency Vulnerability Audit (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Install Python Security Analyzers
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Backend Python SAST Analysis (Bandit)
        run: |
          bandit -r backend -x backend/venv,backend/test_system.py,backend/test_security_verification.py --severity-level medium

      - name: Secret Scanning (Pattern Gate)
        run: |
          echo "Scanning for accidental hardcoded secrets..."
          if grep -rnE "sk_live_[0-9a-zA-Z]{24}|ghp_[0-9a-zA-Z]{36}|BEGIN RSA PRIVATE KEY" backend/ frontend/; then
            echo "ERROR: Unredacted production secret pattern detected!"
            exit 1
          fi
          echo "Zero unredacted credentials or private keys detected."

      - name: Backend Security Verification Suite Execution
        run: |
          cd backend
          pip install -r requirements.txt
          python test_security_verification.py
